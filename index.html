<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valley Finish | Gallery</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, sans-serif;
}
body{
  background:#f5f5f5;
  color:#333;
}
header{
  background:#111;
  color:#fff;
  padding:20px;
  text-align:center;
}
header h1{
  font-size:36px;
}
header p{
  color:#ccc;
}

.gallery{
  max-width:1200px;
  margin:40px auto;
  padding:20px;
}
.gallery h2{
  text-align:center;
  margin-bottom:25px;
  font-size:30px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
}
.grid img{
  width:100%;
  height:230px;
  object-fit:cover;
  border-radius:12px;
  transition:.3s;
  cursor:pointer;
}
.grid img:hover{
  transform:scale(1.04);
}

.contact{
  text-align:center;
  padding:50px 20px;
  background:#fff;
}
.contact h2{
  margin-bottom:15px;
}
.whatsapp{
  display:inline-block;
  text-decoration:none;
  background:#25D366;
  color:white;
  padding:15px 28px;
  border-radius:50px;
  font-size:20px;
  font-weight:bold;
}
.whatsapp:hover{
  background:#1da851;
}

footer{
  background:#111;
  color:#bbb;
  text-align:center;
  padding:18px;
}
</style>
</head>

<body>

<header>
  <h1>VALLEY FINISH</h1>
  <p>Professional Painting & Finishing Services</p>
</header>

<section class="gallery">
  <h2>Our Gallery</h2>

  <div class="grid">
    <img src="images/photo1.jpg" alt="">
    <img src="images/photo2.jpg" alt="">
    <img src="images/photo3.jpg" alt="">
    <img src="images/photo4.jpg" alt="">
    <img src="images/photo5.jpg" alt="">
    <img src="images/photo6.jpg" alt="">
    <img src="images/photo7.jpg" alt="">
    <img src="images/photo8.jpg" alt="">
  </div>
</section>

<section class="contact">
  <h2>Contact Us</h2>
  <p>Get a free quote on WhatsApp</p>
  <br>

  <a class="whatsapp"
     href="https://wa.me/YOUR_NUMBER?text=Hello%20Valley%20Finish,%20I%20need%20a%20painting%20quote."
     target="_blank">
     Chat on WhatsApp
  </a>
</section>

<footer>
  © 2026 Valley Finish. All Rights Reserved.
</footer>

</body>
</html>
